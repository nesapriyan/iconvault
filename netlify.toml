[build]
  base = "client"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

# Keep API and storage requests out of the frontend page fallback.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/storage/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
